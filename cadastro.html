<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | Portfólio Fácil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="./img/Captura de tela 2026-11-08 100857.png">
</head>
<body class="pagina-cadastro">
  <!-- MENU: links à esquerda, logo no centro, usuário à direita.
       Para adicionar uma página, copie uma linha <a> -->
  <header class="topo">
    <nav>
      <a href="index.html">Início</a>
      <a href="projetos.html">Meus projetos</a>
      <a href="novo-projeto.html">Novo projeto</a>
      <a href="portfolio.html">Meu portfólio</a>
    </nav>
    <a href="index.html" class="logo"><img src="./img/logocomnome.png" alt="logo"></a>
    <div id="area-usuario"></div>
  </header>

  <main>
    <section class="auth login-auth">
      <div class="login-conteudo cadastro-conteudo">
        <div class="login-identidade">
          <span class="login-icone" aria-hidden="true"></span>
          <h1>Criar sua conta no PortHub</h1>
        </div>
        <div class="caixa-form login-cartao cadastro-cartao">
          <p class="cadastro-intro">É rapidinho e gratuito.</p>
          <div id="mensagem" class="mensagem"></div>
          <form id="form-cadastro">
            <div class="campo cadastro-campo"><label for="nome">Nome completo</label><input type="text" id="nome" placeholder="Seu nome completo" required></div>
            <div class="campo cadastro-campo"><label for="email">E-mail</label><input type="email" id="email" placeholder="Seu e-mail" required></div>
            <div class="campo cadastro-campo"><label for="senha">Senha</label><input type="password" id="senha" minlength="6" placeholder="Mínimo de 6 caracteres" required></div>
            <div class="campo cadastro-campo"><label for="confirmar">Confirmar senha</label><input type="password" id="confirmar" placeholder="Digite a senha novamente" required></div>
            <button class="botao" type="submit">Criar conta grátis</button>
          </form>
          <div class="login-cadastro">
            <p>Já tem conta?</p>
            <a href="login.html">Entrar</a>
          </div>
        </div>
      </div>
    </section>

  </main>
  <footer>
    <div class="rodape">
      <p class="rodape-grande">Mostre o que<br>você <i>constrói.</i></p>
      <p>Portfólio Fácil · Projeto Final · <span class="trocar">Grupo 3</span> · 2026</p>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
